name: Airport Battle browser smoke test

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  airport-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 8000 > /tmp/airport-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
      - name: Verify airport crew NPCs in browser
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--use-gl=swiftshader'] });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            try {
              await page.goto('http://127.0.0.1:8000/', { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForFunction(() => window.__game && typeof window.__game.startGame === 'function', null, { timeout: 60000 });
              await page.locator('#stagesel button[data-st="airport"]').click();
              await page.locator('#startBtn').click();
              await page.waitForFunction(() => window.__game.stage === 'airport' && window.__game.state === 'play', null, { timeout: 60000 });
              await page.waitForTimeout(700);
              const setup = await page.evaluate(() => {
                const G = window.__game, A = G.AIRPORT;
                const crew = G.enemies.filter(e => e.airportCrewActor);
                return {
                  stage: G.stage, state: G.state, airportActive: A.on,
                  crewCount: crew.length,
                  allCrewAreNormalNpcs: crew.length === 16 && crew.every(e =>
                    G.enemies.includes(e) && e.s && e.hp > 0 && e.hpMax > 0 &&
                    e.airportSeatParent && e.airportSeatLocal && e.mk),
                  vehicles: A.vehicles.length,
                  allVehicleSeatsOccupied: A.vehicles.length === 6 &&
                    A.vehicles.every(v => v.driver && v.gunner && v.driverAlive && v.gunnerAlive),
                  posts: A.posts.length,
                  allPostsManned: A.posts.length === 2 && A.posts.every(p => p.crew && p.crewAlive),
                  fighterCrew: crew.filter(e => e.airportSeatParent === A.fighter.g && e.airportRole === 'pilot').length
                };
              });
              console.log('AIRPORT_SETUP ' + JSON.stringify(setup));
              if (setup.stage !== 'airport' || setup.state !== 'play' || !setup.airportActive ||
                  !setup.allCrewAreNormalNpcs || !setup.allVehicleSeatsOccupied ||
                  !setup.allPostsManned || setup.fighterCrew !== 2) {
                throw new Error('Airport NPC setup failed: ' + JSON.stringify(setup));
              }
              const behavior = await page.evaluate(async () => {
                const G = window.__game, A = G.AIRPORT, v = A.vehicles[0], driver = v.driver;
                const followStart = driver.s.position.clone();
                v.x += 4;
                G.airportUpdate(0.02);
                await new Promise(resolve => setTimeout(resolve, 180));
                const expected = v.g.localToWorld(driver.airportSeatLocal.clone());
                const followError = driver.s.position.distanceTo(expected);
                const followMoved = driver.s.position.distanceTo(followStart) > 0.1;
                const hpBefore = driver.hp;
                G.damageEnemy(driver, driver.hp, G.player.pos, false, { pt: G.player.pos.clone() });
                return {
                  followError, followMoved, hpBefore,
                  diedFromDamage: driver.state === 'down',
                  vehicleStopped: v.driverAlive === false && v.alive === false,
                  radarUsesNpcList: G.enemies.includes(A.posts[0].crew) && G.enemies.includes(driver)
                };
              });
              console.log('AIRPORT_CREW_BEHAVIOR ' + JSON.stringify(behavior));
              if (behavior.followError > 0.15 || !behavior.followMoved ||
                  !behavior.diedFromDamage || !behavior.vehicleStopped || !behavior.radarUsesNpcList) {
                throw new Error('Airport crew behavior failed: ' + JSON.stringify(behavior));
              }
              if (errors.length) throw new Error('Browser console/page errors: ' + errors.join(' | '));
              await page.locator('#game').screenshot({ path: '/tmp/airport-control-tower.png' });
              console.log('AIRPORT_BROWSER_TEST_PASS');

              // Regression check for the new trench stage: 100 troops each, held in the trench until the assault button is pressed.
              // Return to the title in-app instead of reloading a WebGL/pointer-locked page.
              await page.evaluate(() => { window.__game.pauseGame(); document.querySelector('#quitBtn').click(); });
              await page.waitForFunction(() => window.__game && window.__game.state === 'title', null, { timeout: 10000 });
              await page.locator('#stagesel button[data-st="trench"]').click();
              await page.locator('#startBtn').click();
              await page.waitForFunction(() => window.__game.stage === 'trench' && window.__game.state === 'play', null, { timeout: 60000 });
              const trenchSetup = await page.evaluate(() => {
                const G = window.__game, T = G.TRENCH, button = document.querySelector('#bTrenchAttack');
                return {
                  stage: G.stage, active: T.on, blue: T.blue.length, orange: T.orange.length,
                  liveBlue: T.blue.filter(G.isUp).length, liveOrange: T.orange.filter(G.isUp).length,
                  commandVisible: getComputedStyle(button).display !== 'none',
                  trenchRows: T.blue.filter(e => !e.trenchBunkerCrew && e.hold && e.passive && Math.abs(e.s.position.z - 38) < 0.02).length === 84 &&
                    T.orange.filter(e => !e.trenchBunkerCrew && e.hold && e.passive && Math.abs(e.s.position.z + 38) < 0.02).length === 84,
                  bunkerSquads: T.blue.filter(e => e.trenchBunkerCrew).length === 16 && T.orange.filter(e => e.trenchBunkerCrew).length === 16
                };
              });
              console.log('TRENCH_SETUP ' + JSON.stringify(trenchSetup));
              if (trenchSetup.stage !== 'trench' || !trenchSetup.active ||
                  trenchSetup.blue !== 100 || trenchSetup.orange !== 100 ||
                  trenchSetup.liveBlue !== 100 || trenchSetup.liveOrange !== 100 ||
                  !trenchSetup.commandVisible || !trenchSetup.trenchRows || !trenchSetup.bunkerSquads) {
                throw new Error('Trench setup failed: ' + JSON.stringify(trenchSetup));
              }
              const assaultButton = await page.locator('#bTrenchAttack').boundingBox();
              await page.mouse.click(assaultButton.x + assaultButton.width / 2, assaultButton.y + assaultButton.height / 2);
              await page.waitForTimeout(400);
              const afterScreenTap = await page.evaluate(() => ({started:window.__game.TRENCH.started,state:window.__game.state,display:getComputedStyle(document.querySelector('#bTrenchAttack')).display}));
              console.log('TRENCH_SCREEN_TAP ' + JSON.stringify(afterScreenTap));
              // Also verify the button's own click action independently of canvas hit-testing.
              if (!afterScreenTap.started) await page.locator('#bTrenchAttack').evaluate(b => b.click());
              await page.waitForFunction(() => window.__game.TRENCH.started, null, { timeout: 10000 });
              const charge = await page.evaluate(() => {
                const T = window.__game.TRENCH;
                return {
                  started: T.started,
                  commandHidden: getComputedStyle(document.querySelector('#bTrenchAttack')).display === 'none',
                  blueOutsideTrench: T.blue.filter(e => e.trenchOrder === 'advance' && !e.trenchBunkerCrew).length
                };
              });
              console.log('TRENCH_CHARGE ' + JSON.stringify(charge));
              if (!charge.started || !charge.commandHidden || charge.blueOutsideTrench < 75) {
                throw new Error('Trench charge failed: ' + JSON.stringify(charge));
              }
              console.log('TRENCH_BROWSER_TEST_PASS');

              // The trench stage must also have a working rear HQ and the same secretary commands.
              await page.waitForTimeout(500);
              const trenchHQ = await page.evaluate(() => {
                const G=window.__game, h=G.hq, talk=document.querySelector('#talk');
                return {
                  hqExists:!!h,
                  playerInside:!!h && G.inHQ(),
                  secretaryPresent:G.enemies.some(e=>e.secretary&&e.state!=='down'),
                  secondSecretaryPresent:G.enemies.some(e=>e.sec2&&e.state!=='down'),
                  ojouPresent:G.enemies.some(e=>e.ojou&&e.state!=='down'),
                  fluterPresent:G.enemies.some(e=>e.fluter&&e.state!=='down'),
                  medicCount:G.enemies.filter(e=>e.medic&&e.state!=='down').length,
                  messengerCount:G.enemies.filter(e=>e.runner&&e.state!=='down').length,
                  aideCount:G.enemies.filter(e=>e.aide&&e.state!=='down').length,
                  talkPrompt:parseFloat(getComputedStyle(talk).opacity)>.5,
                  shoulderButton:!!document.querySelector('#secmain [data-req="shoulder"]'),
                  mealButton:!!document.querySelector('#secmain [data-req="meal"]'),
                  corpseButton:!!document.querySelector('#secmain [data-req="corpse"]')
                };
              });
              console.log('TRENCH_HQ ' + JSON.stringify(trenchHQ));
              if (!trenchHQ.hqExists || !trenchHQ.playerInside || !trenchHQ.secretaryPresent ||
                  !trenchHQ.secondSecretaryPresent || !trenchHQ.ojouPresent || !trenchHQ.fluterPresent ||
                  trenchHQ.medicCount < 8 || trenchHQ.messengerCount < 2 || trenchHQ.aideCount < 2 ||
                  !trenchHQ.talkPrompt || !trenchHQ.shoulderButton || !trenchHQ.mealButton || !trenchHQ.corpseButton) {
                throw new Error('Trench HQ setup failed: ' + JSON.stringify(trenchHQ));
              }
              console.log('TRENCH_HQ_BROWSER_TEST_PASS');

              // Spawn both sides' mechanized reinforcements and verify that a vehicle passenger is a normal, damageable NPC.
              await page.evaluate(() => { window.__game.TRENCH.elapsed=35.01; window.__game.TRENCH.reinfDone=false; });
              await page.waitForFunction(() => window.__game.TRENCH.cars.length === 6, null, { timeout: 10000 });
              const mechTest = await page.evaluate(() => {
                const G=window.__game,T=G.TRENCH;
                const blue=T.cars.filter(c=>c.team==='blue'),orange=T.cars.filter(c=>c.team==='orange');
                const passenger=orange[0]&&orange[0].crew[0];
                const visible=!!passenger&&passenger.s.visible&&passenger.bb.visible&&Number.isFinite(passenger.s.position.x);
                if(passenger)G.damageEnemy(passenger,passenger.hp+1,passenger.s.position.clone(),false,{pt:passenger.s.position.clone()},null);
                return {blueCars:blue.length,orangeCars:orange.length,crewCount:T.cars.reduce((n,c)=>n+c.crew.length,0),visible,passengerDown:!!passenger&&passenger.state==='down',noWhiteFlash:!!passenger&&passenger.flash===0};
              });
              console.log('TRENCH_MECHANIZED ' + JSON.stringify(mechTest));
              if(mechTest.blueCars!==3||mechTest.orangeCars!==3||mechTest.crewCount!==24||!mechTest.visible||!mechTest.passengerDown||!mechTest.noWhiteFlash) throw new Error('Trench mechanized test failed: '+JSON.stringify(mechTest));
              console.log('TRENCH_MECHANIZED_BROWSER_TEST_PASS');

              // Regression check: the HQ relaxation corner and secretary requests, including moving a fallen NPC there.
              await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForFunction(() => window.__game && typeof window.__game.startGame === 'function', null, { timeout: 60000 });
              await page.locator('#stagesel button[data-st="plains"]').click();
              await page.locator('#startBtn').click();
              await page.waitForFunction(() => window.__game.stage === 'plains' && window.__game.state === 'play', null, { timeout: 60000 });
              const hqReady = await page.evaluate(() => {
                const G=window.__game, h=G.hq;
                return {
                  hqExists:!!h, safeBounds:!!h && h.x1>h.x0 && h.z1>h.z0,
                  secretaryPresent:G.enemies.some(e=>e.secretary&&e.state!=='down'),
                  shoulderButton:!!document.querySelector('#secmain [data-req="shoulder"]'),
                  mealButton:!!document.querySelector('#secmain [data-req="meal"]'),
                  corpseButton:!!document.querySelector('#secmain [data-req="corpse"]')
                };
              });
              console.log('RELAXATION_HQ ' + JSON.stringify(hqReady));
              if (!hqReady.hqExists || !hqReady.safeBounds || !hqReady.secretaryPresent ||
                  !hqReady.shoulderButton || !hqReady.mealButton || !hqReady.corpseButton) {
                throw new Error('Relaxation HQ setup failed: ' + JSON.stringify(hqReady));
              }
              const corpseTest = await page.evaluate(async () => {
                const G=window.__game, h=G.hq, target=G.enemies.find(e=>e.team==='orange'&&e.state!=='down'&&!e.special);
                if(!target)throw new Error('No enemy available for corpse transport test');
                G.damageEnemy(target,target.hp+1,G.player.pos,false,{pt:G.player.pos.clone()});
                G.player.pos.set(h.sx,0,h.sz);
                await new Promise(resolve=>setTimeout(resolve,1400));
                G.player.pos.set(h.sx,0,h.sz);
                const before=G.bodies.length;
                G.SEC_REQ.corpse();
                const carried=G.bodies.find(b=>b.relaxCorpse);
                return {bodyCreated:G.bodies.length>=before,carried:!!carried,
                  x:carried&&carried.s.position.x,z:carried&&carried.s.position.z,
                  expectedX:h.sx-2.35,expectedZ:h.sz+0.08,
                  inHQ:G.inHQ()};
              });
              console.log('RELAXATION_CORPSE ' + JSON.stringify(corpseTest));
              if (!corpseTest.bodyCreated || !corpseTest.carried || !corpseTest.inHQ ||
                  Math.abs(corpseTest.x-corpseTest.expectedX)>0.1 ||
                  Math.abs(corpseTest.z-corpseTest.expectedZ)>0.1) {
                throw new Error('Corpse transport failed: ' + JSON.stringify(corpseTest));
              }
              console.log('RELAXATION_BROWSER_TEST_PASS');
            } finally {
              await browser.close();
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
