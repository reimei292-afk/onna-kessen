name: Airport Battle browser smoke test

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  airport-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 8000 > /tmp/airport-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
      - name: Verify airport crew NPCs in browser
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--use-gl=swiftshader'] });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            try {
              await page.goto('http://127.0.0.1:8000/', { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForFunction(() => window.__game && typeof window.__game.startGame === 'function', null, { timeout: 60000 });
              await page.locator('#stagesel button[data-st="airport"]').click();
              await page.locator('#startBtn').click();
              await page.waitForFunction(() => window.__game.stage === 'airport' && window.__game.state === 'play', null, { timeout: 60000 });
              await page.waitForTimeout(700);
              const setup = await page.evaluate(() => {
                const G = window.__game, A = G.AIRPORT;
                const crew = G.enemies.filter(e => e.airportCrewActor);
                return {
                  stage: G.stage, state: G.state, airportActive: A.on,
                  crewCount: crew.length,
                  allCrewAreNormalNpcs: crew.length === 16 && crew.every(e =>
                    G.enemies.includes(e) && e.s && e.hp > 0 && e.hpMax > 0 &&
                    e.airportSeatParent && e.airportSeatLocal && e.mk),
                  vehicles: A.vehicles.length,
                  allVehicleSeatsOccupied: A.vehicles.length === 6 &&
                    A.vehicles.every(v => v.driver && v.gunner && v.driverAlive && v.gunnerAlive),
                  posts: A.posts.length,
                  allPostsManned: A.posts.length === 2 && A.posts.every(p => p.crew && p.crewAlive),
                  fighterCrew: crew.filter(e => e.airportSeatParent === A.fighter.g && e.airportRole === 'pilot').length
                };
              });
              console.log('AIRPORT_SETUP ' + JSON.stringify(setup));
              if (setup.stage !== 'airport' || setup.state !== 'play' || !setup.airportActive ||
                  !setup.allCrewAreNormalNpcs || !setup.allVehicleSeatsOccupied ||
                  !setup.allPostsManned || setup.fighterCrew !== 2) {
                throw new Error('Airport NPC setup failed: ' + JSON.stringify(setup));
              }
              const behavior = await page.evaluate(async () => {
                const G = window.__game, A = G.AIRPORT, v = A.vehicles[0], driver = v.driver;
                const followStart = driver.s.position.clone();
                v.x += 4;
                G.airportUpdate(0.02);
                await new Promise(resolve => setTimeout(resolve, 180));
                const expected = v.g.localToWorld(driver.airportSeatLocal.clone());
                const followError = driver.s.position.distanceTo(expected);
                const followMoved = driver.s.position.distanceTo(followStart) > 0.1;
                const hpBefore = driver.hp;
                G.damageEnemy(driver, driver.hp, G.player.pos, false, { pt: G.player.pos.clone() });
                return {
                  followError, followMoved, hpBefore,
                  diedFromDamage: driver.state === 'down',
                  vehicleStopped: v.driverAlive === false && v.alive === false,
                  radarUsesNpcList: G.enemies.includes(A.posts[0].crew) && G.enemies.includes(driver)
                };
              });
              console.log('AIRPORT_CREW_BEHAVIOR ' + JSON.stringify(behavior));
              if (behavior.followError > 0.15 || !behavior.followMoved ||
                  !behavior.diedFromDamage || !behavior.vehicleStopped || !behavior.radarUsesNpcList) {
                throw new Error('Airport crew behavior failed: ' + JSON.stringify(behavior));
              }
              if (errors.length) throw new Error('Browser console/page errors: ' + errors.join(' | '));
              await page.locator('#game').screenshot({ path: '/tmp/airport-control-tower.png' });
              console.log('AIRPORT_BROWSER_TEST_PASS');

              // Regression check for the new trench stage: 100 troops each, held in the trench until the assault button is pressed.
              await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForFunction(() => window.__game && typeof window.__game.startGame === 'function', null, { timeout: 60000 });
              await page.locator('#stagesel button[data-st="trench"]').click();
              await page.locator('#startBtn').click();
              await page.waitForFunction(() => window.__game.stage === 'trench' && window.__game.state === 'play', null, { timeout: 60000 });
              const trenchSetup = await page.evaluate(() => {
                const G = window.__game, T = G.TRENCH, button = document.querySelector('#bTrenchAttack');
                return {
                  stage: G.stage, active: T.on, blue: T.blue.length, orange: T.orange.length,
                  liveBlue: T.blue.filter(G.isUp).length, liveOrange: T.orange.filter(G.isUp).length,
                  commandVisible: getComputedStyle(button).display !== 'none',
                  heldInTrench: T.blue.every(e => e.hold && e.passive && Math.abs(e.s.position.z - 38) < 0.02) &&
                    T.orange.every(e => e.hold && e.passive && Math.abs(e.s.position.z + 38) < 0.02)
                };
              });
              console.log('TRENCH_SETUP ' + JSON.stringify(trenchSetup));
              if (trenchSetup.stage !== 'trench' || !trenchSetup.active ||
                  trenchSetup.blue !== 100 || trenchSetup.orange !== 100 ||
                  trenchSetup.liveBlue !== 100 || trenchSetup.liveOrange !== 100 ||
                  !trenchSetup.commandVisible || !trenchSetup.heldInTrench) {
                throw new Error('Trench setup failed: ' + JSON.stringify(trenchSetup));
              }
              await page.locator('#bTrenchAttack').click();
              await page.waitForFunction(() => window.__game.TRENCH.started, null, { timeout: 10000 });
              const charge = await page.evaluate(() => {
                const T = window.__game.TRENCH;
                return {
                  started: T.started,
                  commandHidden: getComputedStyle(document.querySelector('#bTrenchAttack')).display === 'none',
                  blueOutsideTrench: T.blue.filter(e => e.s.position.z < 35.4 && !e.passive).length
                };
              });
              console.log('TRENCH_CHARGE ' + JSON.stringify(charge));
              if (!charge.started || !charge.commandHidden || charge.blueOutsideTrench < 95) {
                throw new Error('Trench charge failed: ' + JSON.stringify(charge));
              }
              console.log('TRENCH_BROWSER_TEST_PASS');
            } finally {
              await browser.close();
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
