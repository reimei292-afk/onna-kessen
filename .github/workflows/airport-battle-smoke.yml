name: Airport Battle browser smoke test

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  airport-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 8000 > /tmp/airport-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
      - name: Test Airport Ground Assault and Control Tower HQ
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--use-gl=swiftshader'] });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
            try {
              await page.goto('http://127.0.0.1:8000/', { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForFunction(() => window.__game && window.__game.AIRPORT && typeof window.__game.startGame === 'function', null, { timeout: 60000 });
              await page.locator('#stagesel button[data-st="airport"]').click();
              await page.locator('#startBtn').click();
              await page.waitForFunction(() => window.__game.stage === 'airport' && window.__game.state === 'play', null, { timeout: 60000 });
              await page.waitForTimeout(600);
              const setup = await page.evaluate(() => {
                const G = window.__game, A = G.AIRPORT;
                return {
                  stage: G.stage, state: G.state, airportActive: A.on,
                  towerGuards: A.towerGuards.length, fieldAllies: A.fieldAllies.length,
                  crewActors: G.enemies.filter(e => e.airportCrewActor).length,
                  crewActorsRegistered: G.enemies.filter(e => e.airportCrewActor).every(e => e.s && e.hp > 0 && e.hpMax > 0 && e.airportSeatParent && e.airportSeatLocal),
                  player: { x: G.player.pos.x, y: G.player.pos.y, z: G.player.pos.z, yaw: G.player.yaw },
                  hq: G.hq ? G.hq() : null,
                  secretaryPresent: !!G.sec.e, secondSecretaryPresent: !!G.sec2.e,
                  blueMedics: G.medics.blue.filter(m => m.e && m.e.state !== 'down').length,
                  towerInterior: !!G.hq && G.hq().x0 < -37 && G.hq().x1 > -27 && G.hq().z0 < 0 && G.hq().z1 > 10,
                  plannedGroundEnemies: A.total,
                  allCarsHaveDriverAndGunner: A.vehicles.length === 6 && A.vehicles.every(v => v.driver && v.gunner && v.driverAlive && v.gunnerAlive),
                  allGunPostsManned: A.posts.length === 2 && A.posts.every(p => p.crew && p.crewAlive),
                  fighterHasPilotAndCopilot: !!A.fighter && A.fighter.pilotAlive && A.fighter.copilotAlive && A.fighter.g.children.filter(c => c.type === 'Group').length >= 2,
                  groundVehicles: A.vehicles.length,
                  mannedGunPosts: A.posts.length,
                  fighterHangarAircraft: !!A.fighter,
                  threeStoreyTower: !!document.querySelector('canvas'),
                  noMachineGun: !A.gun
                };
              });
              if (setup.stage !== 'airport' || setup.state !== 'play' || !setup.airportActive ||
                  setup.towerGuards !== 24 || setup.fieldAllies !== 36 ||
                  Math.abs(setup.player.x + 32) > 0.1 || Math.abs(setup.player.z - 7.8) > 0.1 ||
                  !setup.towerInterior || !setup.secretaryPresent || !setup.secondSecretaryPresent ||
                  setup.blueMedics < 1 || setup.plannedGroundEnemies !== 48 || setup.groundVehicles !== 6 || setup.mannedGunPosts !== 2 || !setup.allCarsHaveDriverAndGunner || !setup.allGunPostsManned || setup.crewActors !== 16 || !setup.crewActorsRegistered || !setup.fighterHasPilotAndCopilot || !setup.fighterHangarAircraft || !setup.threeStoreyTower || !setup.noMachineGun) {
                throw new Error('Airport control tower/HQ setup failed: ' + JSON.stringify(setup));
              }
              const assault = await page.evaluate(() => {
                const G = window.__game, A = G.AIRPORT;
                A.introT = 0; A.dropTimer = 0;
                G.waveUpdate(0.02);
                const e = A.drops[0];
                return {
                  spawned: !!e, count: A.drops.length,
                  groundSpawn: !!e && e.s.position.y === 0,
                  noParachuteState: !!e && e.state !== 'airportDrop',
                  noParachuteObject: !!e && !e.airChute,
                  perimeterSpawn: !!e && (Math.abs(e.s.position.x) > 40 || Math.abs(e.s.position.z) > 60),
                  remaining: A.toDrop,
                  team: e && e.team,
                  kind: e && e.kind
                };
              });
              if (!assault.spawned || !assault.groundSpawn || !assault.noParachuteState ||
                  !assault.noParachuteObject || !assault.perimeterSpawn || assault.remaining !== 47 ||
                  assault.team !== 'orange') {
                throw new Error('Ground-based airport invasion check failed: ' + JSON.stringify(assault));
              }
              // 乗員の通常NPC登録、車両追従、被弾・戦死をブラウザ上で検証する。
              const crewBehavior = await page.evaluate(async () => {
                const G = window.__game, A = G.AIRPORT, v = A.vehicles[0], driver = v.driver;
                const beforeHp = driver.hp;
                v.x += 2;
                G.airportUpdate(0.02);
                await new Promise(resolve => setTimeout(resolve, 120));
                const expected = v.g.localToWorld(driver.airportSeatLocal.clone());
                const followError = driver.s.position.distanceTo(expected);
                G.damageEnemy(driver, driver.hp, G.player.pos, false, { pt: G.player.pos.clone() });
                return {
                  crewRegistered: G.enemies.includes(driver),
                  followError,
                  hpBefore: beforeHp,
                  diedFromDamage: driver.state === 'down',
                  vehicleStopped: v.driverAlive === false && v.alive === false
                };
              });
              if (!crewBehavior.crewRegistered || crewBehavior.followError > 0.15 ||
                  !crewBehavior.diedFromDamage || !crewBehavior.vehicleStopped) {
                throw new Error('Airport crew NPC behavior failed: ' + JSON.stringify(crewBehavior));
              }
              await page.waitForTimeout(250);
              await page.locator('#game').screenshot({ path: '/tmp/airport-control-tower.png' });
              if (errors.length) throw new Error('Browser console/page errors: ' + errors.join(' | '));
              console.log(JSON.stringify({ setup, assault, errors }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
