name: Carrier cruise stage browser smoke test

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  carrier-cruise-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 8000 > /tmp/carrier-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
      - name: Verify carrier stage, reused voice lines and elevator
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true,args:['--use-gl=swiftshader']});
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            try {
              await page.goto('http://127.0.0.1:8000/keiku5.html',{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>window.__carrierStage&&window.VOICE_AB&&window.VOICE_AB.lines);
              await page.waitForTimeout(1200);
              const initial=await page.evaluate(()=>({
                canvas:!!document.querySelector('canvas'),
                rendered:window.__carrierStage.renderer.info.render.calls>0,
                crewCount:window.__carrierStage.crewSpots.length,
                reusedVoice:!!window.VOICE_AB.lines['192f280260'],
                voiceFile:window.VOICE_AB.lines['192f280260'].file
              }));
              if(!initial.canvas||!initial.rendered||initial.crewCount<5||!initial.reusedVoice) throw new Error('Carrier initial setup failed: '+JSON.stringify(initial));
              await page.keyboard.press('e');
              await page.waitForFunction(()=>document.querySelector('#dialogue').style.display==='block');
              const dialogue=await page.evaluate(()=>({
                visible:document.querySelector('#dialogue').style.display==='block',
                text:document.querySelector('#dialoguetext').textContent,
                audio:!!window.__carrierVoice&&window.__carrierVoice.src.includes('assets/voices/ab/192f280260.mp3')
              }));
              if(!dialogue.visible||!dialogue.text.includes('点検よし')||!dialogue.audio) throw new Error('Existing voice dialogue failed: '+JSON.stringify(dialogue));
              await page.evaluate(()=>{const p=window.__carrierStage.player;p.x=103;p.y=5;p.z=0;p.deck=2;});
              await page.waitForTimeout(120);
              await page.keyboard.press('e');
              await page.waitForFunction(()=>document.querySelector('#panel').style.display==='block');
              const lift=await page.evaluate(()=>({buttons:document.querySelectorAll('#pbody [data-deck]').length,title:document.querySelector('#ptitle').textContent}));
              if(lift.buttons!==7||lift.title!=='エレベーター') throw new Error('Elevator selection failed: '+JSON.stringify(lift));
              await page.locator('#pbody [data-deck="6"]').click();
              const bridge=await page.evaluate(()=>({deck:window.__carrierStage.player.deck,y:window.__carrierStage.player.y}));
              if(bridge.deck!==6||bridge.y!==25) throw new Error('Bridge deck travel failed: '+JSON.stringify(bridge));
              const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              await mobile.goto('http://127.0.0.1:8000/keiku5.html',{waitUntil:'domcontentloaded'});
              await mobile.waitForFunction(()=>window.__carrierStage);
              const touch=await mobile.locator('#touch').evaluate(e=>getComputedStyle(e).display!=='none');
              if(!touch) throw new Error('Mobile touch controls are hidden');
              if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
              console.log('CARRIER_CRUISE_BROWSER_TEST_PASS '+JSON.stringify({initial,dialogue,lift,bridge,mobileTouch:touch}));
              await mobile.close();
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
